[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-agentsearch"
version = "0.1.0"
description = "LangChain tools for AgentSearch: free live web search, plus pay-per-call extract and JS render ($0.005 USDC on Base via x402)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["langchain-core>=0.3.0,<2.0.0", "httpx>=0.25", "pydantic>=2"]
keywords = ["langchain", "agentsearch", "web-search", "tools", "agents", "x402"]

[project.optional-dependencies]
paid = ["x402[evm]>=2.0"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://agentsearchhq.com/?utm_source=langchain-agentsearch&utm_medium=package"

[tool.hatch.build.targets.wheel]
packages = ["langchain_agentsearch"]

[tool.hatch.build.targets.sdist]
include = ["langchain_agentsearch", "tests", "README.md", "LICENSE", "pyproject.toml"]
